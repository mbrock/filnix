<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>play · nanofil · Filnix wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../dterm.css">
<link rel="preload" href="neon.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="play.css">
</head>
<body>
<header class="library"><div class="library-frame">
  <div class="library-heading"><p class="eyebrow"><a href="../../index.html">Filnix wiki</a></p><h1><a href="../index.html">nanofil</a></h1></div>
  <nav class="doors">
    <a class="door selected" href="./">Play</a>
    <a class="door" href="../index.html">Source</a>
    <a class="door" href="../../docs/">Docs</a>
    <a class="door" href="https://github.com/mbrock/filnix/tree/main/nanofil">GitHub ↗</a>
  </nav>
</div></header>
<main class="play dterm">
  <div class="side">
  <form id="form" class="editor">
    <div class="bar">
      <select id="example" aria-label="Example">
        <option value="hello">hello.c</option>
        <option value="fib">fib.c</option>
        <option value="sum">sum.c</option>
        <option value="list">list.c</option>
        <option value="strings">strings.c</option>
        <option value="shapes">shapes.c</option>
      </select>
      <button id="revert" class="quiet" type="button" hidden title="Back to the example as it was">Revert</button>
      <label class="opt" title="Select all middle-end passes, as with -O"><input id="opt" type="checkbox"> -O</label>
      <button id="run" type="submit" disabled>Compile <kbd id="keys">Ctrl ↵</kbd></button>
    </div>
    <fieldset id="passes" class="passes">
      <legend>Optimization passes</legend>
      <label title="Replace eligible memory slots with SSA temporaries"><input type="checkbox" value="promote"> Promotion</label>
      <label title="Substitute copies and simplify trivial phis"><input type="checkbox" value="copy"> Copy elimination</label>
      <label title="Put eligible remaining objects in exact-sized local storage"><input type="checkbox" value="local_storage"> Local storage</label>
    </fieldset>
    <div class="code" id="code"></div>
    <div class="foot">
      <details id="stages" class="stages">
        <summary><span class="dot"></span><span id="status">loading</span></summary>
        <div class="drop"><div data-slot="stages"></div><div id="memory" class="memory"></div></div>
      </details>
      <span id="pos" class="pos"></span>
    </div>
  </form>
  <section class="panel" id="data-panel"><h2>Data</h2><div data-slot="data"></div></section>
  <section class="panel" id="symbols-panel"><h2>Symbols</h2><div data-slot="symbols"></div></section>
  </div>
  <div class="out">
    <nav class="tabs" id="tabs" data-slot="pipeline">
      <button data-tab="c">C syntax</button>
      <button data-tab="lowered">IR</button>
      <button data-tab="ir">checked IR</button>
      <button data-tab="asm">assembly</button>
    </nav>
    <div data-slot="failure" class="failure"></div>
    <div class="panes">
      <div data-slot="c" class="pane"></div>
      <div data-slot="lowered" class="pane"></div>
      <div data-slot="promote" class="pane"></div>
      <div data-slot="copy" class="pane"></div>
      <div data-slot="local_storage" class="pane"></div>
      <div data-slot="ir" class="pane"></div>
      <div data-slot="irtext" class="pane"></div>
      <div data-slot="asm" class="pane"></div>
    </div>
  </div>
</main>
<script src="../dterm.js"></script>
<script type="module" src="play.js"></script>
</body>
</html>
