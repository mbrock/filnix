<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>play · nanofil · Filnix wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap">
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="../dterm.css">
<link rel="stylesheet" href="play.css">
</head>
<body>
<header class="library"><div class="library-frame">
  <div class="library-heading"><p class="eyebrow"><a href="../../index.html">Filnix wiki</a></p><h1><a href="../index.html">nanofil</a></h1></div>
  <nav class="doors">
    <a class="door selected" href="./">Play</a>
    <a class="door" href="../index.html">Source</a>
    <a class="door" href="../../docs/">Docs</a>
    <a class="door" href="https://github.com/mbrock/filnix/tree/main/nanofil">GitHub ↗</a>
  </nav>
</div></header>
<main class="play dterm">
  <div class="side">
  <form id="form" class="editor">
    <pre class="gutter" id="gutter" aria-hidden="true"></pre>
    <textarea id="source" spellcheck="false" autocomplete="off" wrap="off" aria-label="C source">#include &lt;stdio.h&gt;

int main(void) {
    printf("hello, world\n");
    return 0;
}
</textarea>
  </form>
  <div class="run">
    <button id="run" type="submit" form="form" disabled title="Ctrl+Enter">Compile</button>
    <label><input id="opt" type="checkbox"> -O</label>
    <details id="stages" class="stages">
      <summary><span class="dot"></span><span id="status">loading</span></summary>
      <div class="drop"><div data-slot="stages"></div><div id="memory" class="memory"></div></div>
    </details>
  </div>
  <section class="panel" id="data-panel"><h2>Data</h2><div data-slot="data"></div></section>
  <section class="panel" id="symbols-panel"><h2>Symbols</h2><div data-slot="symbols"></div></section>
  </div>
  <div class="out">
    <nav class="tabs" id="tabs">
      <button data-tab="c">C</button>
      <button data-tab="ir">IR</button>
      <button data-tab="qbe">QBE</button>
      <button data-tab="asm">Assembly</button>
    </nav>
    <div data-slot="failure" class="failure"></div>
    <div class="panes">
      <div data-slot="c" class="pane"></div>
      <div data-slot="ir" class="pane"></div>
      <div data-slot="qbe" class="pane"></div>
      <div data-slot="asm" class="pane"></div>
    </div>
  </div>
</main>
<script src="../dterm.js"></script>
<script src="play.js"></script>
</body>
</html>
