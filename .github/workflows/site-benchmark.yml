# Manual, bounded trial: no persistent volumes or routine paid builds.
# Both machines build the same revision using the same public Nix caches.
name: Site builder comparison

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit to build on both runners (defaults to this workflow's commit)
        type: string
        required: false
      namespace_runner:
        description: Namespace shape to compare with GitHub
        type: choice
        default: namespace-profile-default
        options:
          - namespace-profile-default
          - nscloud-ubuntu-22.04-amd64-16x32

permissions:
  contents: read

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GitHub 4-core
            runner: ubuntu-22.04
          - name: Namespace
            runner: ${{ inputs.namespace_runner || 'namespace-profile-default' }}
    runs-on: ${{ matrix.runner }}
    # Both options use Ubuntu 22.04 / amd64, without cache volumes.
    # At most $0.72 compute for 16x32, or $0.36 for the default 4x16.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Build the same site
        env:
          BUILDER: ${{ matrix.name }}
        run: |
          set -o pipefail
          git rev-parse HEAD > source.txt
          lscpu > machine.txt
          /usr/bin/time -v -o build-time.txt nix build -L .#site 2>&1 | tee build.log
          nix path-info ./result > output.txt
          du -sbL result >> output.txt
          {
            echo "### $BUILDER — $(cat source.txt)"
            echo '```text'
            cat build-time.txt output.txt
            echo '```'
            echo 'Fresh runner; public Nix substituters; no persistent Nix volume.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-benchmark-${{ matrix.runner }}
          retention-days: 3
          path: |
            source.txt
            machine.txt
            build-time.txt
            output.txt
            build.log
