# Browser checks are off the publish path; retention takes its lock twice a day.
name: Site checks

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  # Every browser job checks the same release, even if Site publishes meanwhile.
  live:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.live.outputs.sha }}
      url: ${{ steps.live.outputs.url }}
    steps:
      - name: Select the immutable live release
        id: live
        run: |
          sha=$(curl --retry 5 --retry-all-errors -fsS https://filnix.org/commit.txt)
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=https://filnix.org/__releases/$sha" >> "$GITHUB_OUTPUT"

  browser:
    needs: live
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: site-browser
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.live.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the browser
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Check site pages at both phone widths
        env:
          SITE: ${{ needs.live.outputs.url }}
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label 'Phone pages' --timeout 900 -- \
            node packages/site/phone.mjs "$SITE/" 320 390 2>&1 | tee site-phone.log
      - name: Check delayed browser navigation
        run: |
          python3 nanofil/tests/watch.py --label 'Rocq navigation' -- \
            node nanofil/web/rocq/tests/navigation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-logs
          path: site-phone.log
          retention-days: 3

  # Each Rocq page loads twice per width, so one job per width and
  # quarter of the pages keeps every sweep well inside its budget.
  rocq-pages:
    needs: live
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        width: [320, 390]
        shard: [1, 2, 3, 4]
    concurrency:
      group: site-rocq-pages-${{ matrix.width }}-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.live.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the browser
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Check a quarter of the Rocq pages at one phone width
        env:
          SITE: ${{ needs.live.outputs.url }}
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label "Rocq pages ${{ matrix.width }}px ${{ matrix.shard }}/4" --timeout 1200 -- \
            node nanofil/web/rocq/tests/layout.mjs "$SITE" --pages-only --shard=${{ matrix.shard }}/4 ${{ matrix.width }} \
            2>&1 | tee rocq-phone.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocq-phone-${{ matrix.width }}-${{ matrix.shard }}
          path: rocq-phone.log
          retention-days: 3

  retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: filnix-org
    # Match Site and recovery. Read current.json only after taking the lock.
    concurrency:
      group: filnix-org
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Retain the current, newest five and all recent snapshots
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILNIX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILNIX_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint=https://d66b4fdcf8b2d4b0949d7fa3518b9b58.r2.cloudflarestorage.com
          aws --endpoint-url "$endpoint" s3 cp s3://filnix-site/current.json current.json --no-progress
          sha=$(python3 -c 'import json; print(json.load(open("current.json"))["sha"])')
          aws --endpoint-url "$endpoint" s3api list-objects-v2 \
            --bucket filnix-site --prefix releases/ --output json > bucket.json
          aws --endpoint-url "$endpoint" s3api list-objects-v2 \
            --bucket filnix-site --prefix blobs/ --output json > blobs.json
          python3 deploy/site/prune.py bucket.json "$sha" \
            --blobs-inventory blobs.json --endpoint-url "$endpoint"
