# The documents' references and the guide's outputs (checks.nanofil-docs,
# nanofil/nix/docs.nix) after each push that changes nanofil: about a
# minute, apart from the compiler smoke check (nanofil.yml), which documents
# and theories no longer rerun. It never blocks a push.
name: Nanofil docs

on:
  push:
    branches: [main]
    paths:
      - "nanofil/**"
      - flake.lock
      - .github/workflows/nanofil-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanofil-docs-${{ github.ref }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          python3 nanofil/tests/watch.py --label 'Staging cache preflight' -- \
            python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Check the documents
        run: |
          python3 nanofil/tests/watch.py --label nanofil-docs --warn-after 300 --timeout 900 -- \
            nix build -L --no-link .#checks.x86_64-linux.nanofil-docs 2>&1 | tee nanofil-docs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-docs-log
          path: nanofil-docs.log
