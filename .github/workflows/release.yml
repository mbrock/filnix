# Publishes a GitHub release for a v* tag (scripts/release makes one): the
# PHP and BIND tarballs, their container images as docker-archives, the
# /opt/fil tarball, the relocatable filroot tarball and their SHA-256 sums,
# and pushes the images to ghcr.io under their versions and the release tag.
# PHP 8.5 and BIND are also published built with the staging toolchain,
# marked -staging in their file names and image tags.
# Like cache.yml it builds nothing: every output must already be in the
# public caches.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to (re)publish
        required: true

permissions:
  contents: read

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
    max-jobs = 0
    builders =
  RELEASE: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE }}
      - uses: cachix/install-nix-action@v31
      - name: Outputs are in the public caches
        run: python3 scripts/ci-cache-check.py
      - name: Substitute
        run: |
          nix build .#php-dist --out-link php-dist
          nix build .#php-docker --out-link php-docker
          nix build .#optfil --out-link optfil
          nix build .#filroot --out-link filroot
          nix build .#bind-dist --out-link bind-dist
          nix build .#bind-docker --out-link bind-docker
          nix build .#php85-staging-dist --out-link php85-staging-dist
          nix build .#php85-staging-docker --out-link php85-staging-docker
          nix build .#bind-staging-dist --out-link bind-staging-dist
          nix build .#bind-staging-docker --out-link bind-staging-docker
          echo "PHP_VERSION=$(nix eval --raw .#php-docker.imageTag)" >> "$GITHUB_ENV"
          echo "BIND_VERSION=$(nix eval --raw .#bind-docker.imageTag)" >> "$GITHUB_ENV"
          # Image tags such as 8.5.12-staging.
          echo "PHP_STAGING=$(nix eval --raw .#php85-staging-docker.imageTag)" >> "$GITHUB_ENV"
          echo "BIND_STAGING=$(nix eval --raw .#bind-staging-docker.imageTag)" >> "$GITHUB_ENV"
      - name: The tarballs run without Nix
        run: |
          packages/php-dist/test/run.sh php-dist debian:13 alpine:3
          packages/optfil/test/run.sh optfil debian:13 alpine:3
          packages/filroot/test/run.sh filroot debian:13 alpine:3
          packages/bind-dist/test/run.sh bind-dist debian:13 alpine:3
          packages/php-dist/test/run.sh php85-staging-dist debian:13 alpine:3
          packages/bind-dist/test/run.sh bind-staging-dist debian:13 alpine:3
      - name: The images serve PHP
        run: |
          for image in php-docker:$PHP_VERSION php85-staging-docker:$PHP_STAGING; do
            podman load < "${image%%:*}"
            podman run --rm "filnix-php:${image#*:}" php -r 'echo PHP_VERSION, "\n"; exit(extension_loaded("Zend OPcache") ? 0 : 1);'
          done
      - name: The images serve DNS
        run: |
          for image in bind-docker:$BIND_VERSION bind-staging-docker:$BIND_STAGING; do
            tag=${image#*:}
            podman load < "${image%%:*}"
            podman run --rm --entrypoint named-checkconf "filnix-bind:$tag"
            podman run -d --name bind -p 15353:53/udp "filnix-bind:$tag"
            sleep 5
            # named reports the BIND version, without -staging.
            podman exec bind dig @127.0.0.1 version.bind CH TXT +short | grep -F "${tag%-staging}"
            podman rm -f bind
          done
      - name: Assets
        run: |
          mkdir assets
          cp -L php-dist "assets/$(basename "$(readlink php-dist)" | cut -d- -f2-)"
          cp -L optfil "assets/$(basename "$(readlink optfil)" | cut -d- -f2-)"
          cp -L filroot "assets/$(basename "$(readlink filroot)" | cut -d- -f2-)"
          cp -L php-docker "assets/filnix-php-$PHP_VERSION-docker.tar.gz"
          cp -L bind-dist "assets/$(basename "$(readlink bind-dist)" | cut -d- -f2-)"
          cp -L bind-docker "assets/filnix-bind-$BIND_VERSION-docker.tar.gz"
          cp -L php85-staging-dist "assets/$(basename "$(readlink php85-staging-dist)" | cut -d- -f2-)"
          cp -L php85-staging-docker "assets/filnix-php-$PHP_STAGING-docker.tar.gz"
          cp -L bind-staging-dist "assets/$(basename "$(readlink bind-staging-dist)" | cut -d- -f2-)"
          cp -L bind-staging-docker "assets/filnix-bind-$BIND_STAGING-docker.tar.gz"
          # Each output has its own file name.
          test "$(ls assets | wc -l)" = 10
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Push the images to ghcr.io
        run: |
          owner=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          push() {
            for tag in "$3" "$3-$RELEASE"; do
              skopeo copy --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                "docker-archive:$1" "docker://$owner/$2:$tag"
            done
          }
          push php-docker filnix-php "$PHP_VERSION"
          push bind-docker filnix-bind "$BIND_VERSION"
          push php85-staging-docker filnix-php "$PHP_STAGING"
          push bind-staging-docker filnix-bind "$BIND_STAGING"
          echo "IMAGE=$owner/filnix-php" >> "$GITHUB_ENV"
          echo "BIND_IMAGE=$owner/filnix-bind" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          Built by the Filnix campaign from $(git rev-parse --short=12 HEAD) and
          substituted from https://filc.cachix.org; nothing here was compiled on CI.

          - \`php-$PHP_VERSION-filc-x86_64-linux.tar.xz\`: PHP $PHP_VERSION with php-fpm,
            php-cgi and phpdbg, relocatable, for any x86-64 Linux. See its README.
          - \`optfil-*.tar.xz\`: the Fil-C toolchain and userland for \`/opt/fil\`
            (\`sudo tar -C /opt -xJf optfil-*.tar.xz\`).
          - \`filroot-*.tar.xz\`: the same toolchain and userland, relocatable:
            unpack anywhere and put its \`bin\` on PATH. Programs built with it
            run from its own shell or through \`fil-run\`; see docs/filroot.md.
          - \`filnix-php-$PHP_VERSION-docker.tar.gz\`: the container image
            (\`docker load < filnix-php-$PHP_VERSION-docker.tar.gz\`), also
            \`docker pull $IMAGE:$PHP_VERSION-$RELEASE\`.
          - \`bind-$BIND_VERSION-filc-x86_64-linux.tar.xz\`: BIND $BIND_VERSION (named, dig,
            rndc and the other tools), relocatable, for any x86-64 Linux. A
            research build; see https://mbrock.github.io/filnix/fil-bind/.
          - \`filnix-bind-$BIND_VERSION-docker.tar.gz\`: a BIND image laid out
            like ISC's internetsystemsconsortium/bind9, also
            \`docker pull $BIND_IMAGE:$BIND_VERSION-$RELEASE\`.

          ### Staging alternates

          The assets and image tags marked \`-staging\` are built with the
          staging Fil-C toolchain: an experimental toolchain with unreleased
          compiler and runtime changes. It is faster but less reviewed than the
          release toolchain used for everything above, which stays the default.
          See https://github.com/mbrock/filnix/blob/$(git rev-parse --short=12 HEAD)/docs/php.md
          for what the staging changes do for PHP and how much faster they are,
          and https://github.com/mbrock/filnix/blob/$(git rev-parse --short=12 HEAD)/docs/upstream-updates.md
          for how staging changes are reviewed and promoted.

          - \`php-$PHP_STAGING-filc-x86_64-linux.tar.xz\` and
            \`filnix-php-$PHP_STAGING-docker.tar.gz\`: PHP ${PHP_STAGING%-staging}
            with the same programs, layout and extensions as the default PHP,
            except igbinary, which does not build on PHP 8.5. Also
            \`docker pull $IMAGE:$PHP_STAGING-$RELEASE\`.
          - \`bind-$BIND_STAGING-filc-x86_64-linux.tar.xz\` and
            \`filnix-bind-$BIND_STAGING-docker.tar.gz\`: BIND ${BIND_STAGING%-staging}
            built the same way as the default BIND. Also
            \`docker pull $BIND_IMAGE:$BIND_STAGING-$RELEASE\`.
          EOF
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" assets/* --clobber
          else
            gh release create "$RELEASE" assets/* --title "Filnix $RELEASE" --notes-file notes.md --verify-tag
          fi
