# nanofil's whole check (checks.nanofil, nanofil/nix/check.nix) after each
# push that changes nanofil, split into shards that run side by side. It
# never blocks a push: a red shard is fixed forward on main. Run it on a
# branch with workflow_dispatch to see a change's result before pushing it.
name: Nanofil

on:
  push:
    branches: [main]
    # What the shards read (nix/check.nix's fileset and imports) and what
    # sets their toolchain; documents and theories have their own checks.
    paths:
      - "nanofil/src/**"
      - "nanofil/bin/**"
      - "nanofil/tests/**"
      - nanofil/nix/check.nix
      - nanofil/nix/corpus.nix
      - nanofil/nix/trealla.nix
      - flake.nix
      - flake.lock
      - .github/workflows/nanofil.yml
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch; a newer push waits and supersedes any
# other waiting run, so the latest main is always tested.
concurrency:
  group: nanofil-${{ github.ref }}

jobs:
  check:
    name: Shard ${{ matrix.shard }}/8
    runs-on: nscloud-ubuntu-22.04-amd64-16x32
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - name: Let deliberate traps exit without a crash reporter
        # The checks trap thousands of times (bounds edges); a core_pattern
        # that pipes each crash to apport makes a 22 s step overrun 120 s.
        run: |
          echo "core_pattern was: $(cat /proc/sys/kernel/core_pattern)"
          sudo sysctl -w kernel.core_pattern=core
      - uses: cachix/install-nix-action@v31
      # Only trusted main publishes, and only the shard's own (empty)
      # output: a later run with the same inputs, such as a flake.nix edit
      # elsewhere, substitutes the shard instead of rerunning it.
      - name: Install the shard cache publisher
        if: github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@v16
        with:
          name: filc
          skipPush: true
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          grep 'core file' "/proc/$(pgrep -o nix-daemon)/limits"
          python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Check
        env:
          SHARD: ${{ matrix.shard }}/8
        run: |
          set -o pipefail
          nix build -L --rebuild --no-link --print-out-paths --impure --expr \
            "(builtins.getFlake (toString ./.)).lib.x86_64-linux.nanofil-check { shard = \"$SHARD\"; }" \
            2>&1 | tee nanofil.log
      - name: Publish the shard's output
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: grep -x '/nix/store/[^ ]*' nanofil.log | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-shard-${{ matrix.shard }}
          path: nanofil.log
