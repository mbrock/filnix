# Named default-path smoke coverage on relevant pushes; the whole check
# twice daily and on demand. Both use nanofil/nix/check.nix's harness.
name: Nanofil

on:
  push:
    branches: [main]
    # What the check reads (nix/check.nix's fileset and imports) and what
    # sets their toolchain; documents and theories have their own checks.
    paths:
      - "nanofil/src/**"
      - "nanofil/bin/**"
      - "nanofil/tests/**"
      - nanofil/nix/check.nix
      - nanofil/nix/corpus.nix
      - nanofil/nix/trealla.nix
      - flake.nix
      - flake.lock
      - toolchain.nix
      - build-filc.nix
      - "compiler/**"
      - "runtime/**"
      - "toolchain/**"
      - .github/workflows/nanofil.yml
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Active checks finish and cache their output; only pending pushes coalesce.
# Smoke and scheduled/manual full checks run independently.
concurrency:
  group: nanofil-${{ github.event_name == 'push' && 'smoke' || 'full' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: ${{ github.event_name == 'push' && 'Smoke' || 'Full suite' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'push' && 30 || 240 }}
    env:
      CHECK: ${{ github.event_name == 'push' && 'nanofil-smoke' || 'nanofil' }}
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - name: Let deliberate traps exit without a crash reporter
        # The checks trap thousands of times (bounds edges); a core_pattern
        # that pipes each crash to apport makes a 22 s step overrun 120 s.
        run: |
          echo "core_pattern was: $(cat /proc/sys/kernel/core_pattern)"
          sudo sysctl -w kernel.core_pattern=core
      - uses: cachix/install-nix-action@v31
      # Only trusted main publishes, and only the check's own (empty)
      # output: a later run with the same inputs, such as a flake.nix edit
      # elsewhere, substitutes the check instead of rerunning it.
      - name: Install the check cache publisher
        if: github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@v16
        with:
          name: filc
          skipPush: true
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          grep 'core file' "/proc/$(pgrep -o nix-daemon || echo $$)/limits"
          python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Check
        run: |
          set -o pipefail
          nix build -L --no-link --print-out-paths ".#checks.x86_64-linux.$CHECK" \
            2>&1 | tee nanofil.log
      - name: Publish the check's output
        if: github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: grep -x '/nix/store/[^ ]*' nanofil.log | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CHECK }}
          path: nanofil.log
