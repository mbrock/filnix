# The Gallina backend's check (nanofil/rocq/backend, docs/gallina-backend.md)
# after each push that changes it or the Prolog files whose output it must
# reproduce byte for byte: the reader, pizlonation, promotion, copy
# propagation, the Fil-C ABI and emission, and asm.pl. Keep this list to
# those. It never blocks a push:
# a red run is fixed forward on main.
# The crane job holds the same Gallina, extracted to C++ by Crane
# (nanofil/nix/backend-crane.nix), to the same outputs on the IR
# fixtures. Extracting and compiling the C++ takes minutes on one
# translation unit, which is why it is a job of its own.
# workflow_dispatch with full takes the whole corpus, with and without -O,
# and the translation units of zlib, GNU hello and Lua; it is about an
# hour of one core's work.
name: Nanofil Backend

on:
  push:
    branches: [main]
    paths:
      - "nanofil/rocq/backend/**"
      - nanofil/nix/backend.nix
      - nanofil/nix/backend-crane.nix
      - nanofil/nix/crane.nix
      - nanofil/nix/crane-nanofil.patch
      - nanofil/src/asm.pl
      - nanofil/src/copy.pl
      - nanofil/src/filc_abi.pl
      - nanofil/src/filc_amd64.pl
      - nanofil/src/ir_text.pl
      - nanofil/src/pizlonate.pl
      - nanofil/src/promote.pl
      - .github/workflows/nanofil-backend.yml
  workflow_dispatch:
    inputs:
      full:
        description: Compare on the whole corpus, with and without -O, and on zlib, hello and Lua
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nanofil-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - name: Select the quick check or the whole corpus
        id: select
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = true ]; then root=nanofil-backend-full; else root=nanofil-backend; fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          python3 nanofil/tests/watch.py --label 'Staging cache preflight' -- \
            python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Build and compare
        env:
          ROOT: ${{ steps.select.outputs.root }}
        run: |
          set -o pipefail
          warn=300; limit=900
          if [ "$ROOT" = nanofil-backend-full ]; then warn=1800; limit=3300; fi
          python3 nanofil/tests/watch.py --label "$ROOT" --warn-after "$warn" --timeout "$limit" -- \
            nix build -L --no-link --cores 2 ".#checks.x86_64-linux.$ROOT" 2>&1 | tee nanofil-backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-backend-log
          path: nanofil-backend.log

  crane:
    if: ${{ !inputs.full }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Extract to C++, build and compare
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label nanofil-backend-crane --warn-after 1500 --timeout 3000 -- \
            nix build -L --no-link --cores 4 .#checks.x86_64-linux.nanofil-backend-crane 2>&1 | tee nanofil-backend-crane.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-backend-crane-log
          path: nanofil-backend-crane.log
