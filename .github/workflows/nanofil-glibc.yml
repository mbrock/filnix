# The glibc campaign stays incremental and on push, beside Rocq and Gate.
name: Nanofil glibc

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - "nanofil/rocq/glibc/**"
      - "nanofil/rocq/theories/**"
      - nanofil/nix/glibc.nix
      - nanofil/nix/hello-glibc.nix
      - nanofil/nix/rocq.nix
      - nanofil/nix/rocq-packages.nix
      - "nanofil/survey/glibc/capture.nix"
      - "nanofil/survey/glibc/mixed.nix"
      - "nanofil/survey/glibc/regress.nix"
      - "nanofil/survey/glibc/patches/**"
      - "nanofil/survey/glibc/regress/**"
      - "nanofil/survey/glibc/run/mem16.c"
      - nanofil/tests/watch.py
      - nanofil/tests/rocq_time.py
      - nanofil/tests/rocq_time_test.py
      - nanofil/web/rocq/rocq_syntax.pl
      - nanofil/web/rocq/tests/parse.sh
      - nanofil/web/rocq/tests/reprint.pl
      - toolchain.nix
      - "toolchain/**"
      - "compiler/**"
      - "runtime/**"
      - .github/workflows/nanofil-glibc.yml
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

# The push check and the scheduled or manual abstract check run independently.
concurrency:
  group: nanofil-glibc-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || 'full' }}
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
    builders =

jobs:
  glibc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: github.ref == 'refs/heads/main'
        with:
          name: filc
          skipPush: true
      - name: Require the cached staging toolchain
        run: python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Compile, reprint and probe glibc contracts
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label nanofil-glibc --warn-after 300 --timeout 3600 -- \
            nix build -L --no-link --keep-going --max-jobs auto --cores 0 \
            .#checks.x86_64-linux.nanofil-glibc 2>&1 | tee nanofil-glibc.log
      # The Fil-C glibc source fixes (survey/glibc/patches): the stock
      # units must fail filcc's checks at -O0 and the patched ones pass.
      # locarch-stock and locarch (the locale loader harness) stay by
      # hand, like mixed.nix's own builds.
      - name: Patched glibc units regression
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label glibc-units --warn-after 300 --timeout 1200 -- \
            nix build -L --no-link -f nanofil/survey/glibc/regress.nix units 2>&1 | tee glibc-units.log
      - name: Cache completed objects and verdicts
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          { nix eval --raw .#checks.x86_64-linux.nanofil-glibc --apply 'g: builtins.concatStringsSep "\n"
              (map (d: d.outPath) (builtins.attrValues g.model.vo ++ builtins.attrValues g.vo ++ builtins.attrValues g.reprint ++ builtins.attrValues g.abstractHello.vo ++ [ g.abstractHello g.probes g ]))'; echo
            # The Rocq 9.3 package set (nanofil/nix/rocq-packages.nix), which no
            # public cache has.
            nix eval --raw --impure --expr 'let pkgs = import (builtins.getFlake (toString ./.)).inputs.nixpkgs { system = "x86_64-linux"; };
                r = import ./nanofil/nix/rocq-packages.nix { inherit pkgs; }; in builtins.concatStringsSep "\n" (map (d: d.outPath) [ r.rocq-core r.stdlib r.stdpp r.iris ])'; echo
          } |
            while read -r p; do if [ -e "$p" ]; then echo "$p"; fi; done | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-glibc-log
          path: |
            nanofil-glibc.log
            glibc-units.log
          retention-days: 3

  # The push check compiles Hello's files against an abstract runtime.
  # This one compiles every file that rocq/glibc/runtime-concrete.txt does
  # not list, and requires each listed file to be rejected.
  abstract:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: github.ref == 'refs/heads/main'
        with:
          name: filc
          skipPush: true
      - name: Require the cached staging toolchain
        run: python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Compile every general file against an abstract runtime
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label nanofil-glibc-abstract --warn-after 300 --timeout 6000 -- \
            nix build -L --no-link --keep-going --max-jobs auto --cores 0 \
            .#checks.x86_64-linux.nanofil-glibc-abstract 2>&1 | tee nanofil-glibc-abstract.log
      - name: Cache completed abstract objects
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          { nix eval --raw .#checks.x86_64-linux.nanofil-glibc-abstract --apply 'g: builtins.concatStringsSep "\n"
              (map (d: d.outPath) (builtins.attrValues g.vo ++ builtins.attrValues g.rejected ++ [ g ]))'; echo; } |
            while read -r p; do if [ -e "$p" ]; then echo "$p"; fi; done | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-glibc-abstract-log
          path: nanofil-glibc-abstract.log
          retention-days: 3
