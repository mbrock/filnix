# The glibc campaign stays incremental and on push, beside Rocq and Gate.
name: Nanofil glibc

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - "nanofil/rocq/glibc/**"
      - "nanofil/rocq/theories/**"
      - nanofil/nix/glibc.nix
      - nanofil/nix/hello-glibc.nix
      - nanofil/nix/rocq.nix
      - nanofil/nix/rocq-packages.nix
      - nanofil/rocq/scripts/kernel-flags.py
      - nanofil/tests/kernel_flags_test.py
      - "nanofil/survey/glibc/capture.nix"
      - "nanofil/survey/glibc/mixed.nix"
      - "nanofil/survey/glibc/regress.nix"
      - "nanofil/survey/glibc/patches/**"
      - "nanofil/survey/glibc/regress/**"
      - "nanofil/survey/glibc/run/mem16.c"
      - nanofil/tests/watch.py
      - nanofil/tests/rocq_time.py
      - nanofil/tests/rocq_time_test.py
      - nanofil/tests/rocq_runtime_audit.py
      - nanofil/tests/rocq_reject.py
      - nanofil/tests/rocq_interface.py
      - nanofil/tests/hello_premises.py
      - nanofil/web/rocq/rocq_syntax.pl
      - nanofil/web/rocq/tests/parse.sh
      - nanofil/web/rocq/tests/reprint.pl
      - toolchain.nix
      - "toolchain/**"
      - "compiler/**"
      - "runtime/**"
      - .github/workflows/nanofil-glibc.yml
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

# The push check and the scheduled or manual abstract check run independently.
# Every push gets its own group: GitHub keeps one queued run per group and
# cancels the rest, so on a busy main a shared group let few runs finish,
# and the cache of compiled objects fell behind main. Runs that overlap
# share their objects through Cachix as they build them.
concurrency:
  group: nanofil-glibc-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'full' }}
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
    builders =

jobs:
  glibc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: github.ref == 'refs/heads/main'
        with:
          name: filc
          skipPush: true
      - name: Require the cached staging toolchain
        run: python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      # hello_premises.py parses hello_never_panics's statement; the number
      # it prints is the Hello proof's progress measure.
      - name: Count the open premises of hello_never_panics
        run: python3 nanofil/tests/hello_premises.py
      - name: Add swap for overlapping heavy compiles
        run: |
          sudo fallocate -l 12G /mnt/nanofil.swap && sudo chmod 600 /mnt/nanofil.swap &&
            sudo mkswap /mnt/nanofil.swap >/dev/null && sudo swapon /mnt/nanofil.swap ||
            echo "::warning::could not add swap"
          free -m
      # On main, cachix watch-exec publishes each object as it is built, so a
      # run that fails or that a later push overtakes still fills the cache
      # that glibc-tools/warm.sh reads. The last step below remains a backstop.
      # The runner has 4 cores and 16 GB. A glibc compile peaks at 3.5 GB
      # (most files) to 9 GB (LibioWFwide), and three or four at once
      # exhausted memory: the runner killed the step (exit 143) or lost
      # contact. Two jobs fit unless two of the heaviest files coincide,
      # and the swap step above gives that case room to page out.
      - name: Compile and probe glibc contracts
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          set -o pipefail
          publish=()
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$CACHIX_AUTH_TOKEN" ]; then
            publish=(cachix watch-exec filc --)
          fi
          # A change to Fix.v rebuilds its importers even with a warm cache.
          # Each file still has its own watchdog in glibc.nix.
          python3 nanofil/tests/watch.py --label nanofil-glibc --warn-after 300 --timeout 6000 -- \
            "${publish[@]}" nix build -L --no-link --keep-going --max-jobs 2 --cores 0 \
            .#checks.x86_64-linux.nanofil-glibc \
            .#checks.x86_64-linux.nanofil-rocq.kernelFlags 2>&1 | tee nanofil-glibc.log
      # The Fil-C glibc source fixes (survey/glibc/patches): the stock
      # units must fail filcc's checks at -O0 and the patched ones pass.
      # locarch-stock and locarch (the locale loader harness) stay by
      # hand, like mixed.nix's own builds.
      - name: Patched glibc units regression
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label glibc-units --warn-after 300 --timeout 1200 -- \
            nix build -L --no-link -f nanofil/survey/glibc/regress.nix units 2>&1 | tee glibc-units.log
      - name: Cache completed objects and verdicts
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          { nix eval --raw .#checks.x86_64-linux.nanofil-glibc --apply 'g: builtins.concatStringsSep "\n"
              (map (d: d.outPath) (builtins.attrValues g.model.vo ++ builtins.attrValues g.check ++ builtins.attrValues g.exports ++ [ g.interfaces g.probes g ]))'; echo
            # The Rocq 9.3 package set (nanofil/nix/rocq-packages.nix), which no
            # public cache has.
            nix eval --raw --impure --expr 'let pkgs = import (builtins.getFlake (toString ./.)).inputs.nixpkgs { system = "x86_64-linux"; };
                r = import ./nanofil/nix/rocq-packages.nix { inherit pkgs; }; in builtins.concatStringsSep "\n" (map (d: d.outPath) [ r.rocq-core r.stdlib r.stdpp r.iris ])'; echo
          } |
            while read -r p; do if [ -e "$p" ]; then echo "$p"; fi; done | cachix push filc
      # nanofil/AGENTS.md, Rocq proof speed: serial time, critical path,
      # edit-to-result time and the slowest files, printed by the
      # aggregate check whenever it rebuilds. A readout, not a gate.
      - name: Summarize Rocq build-time totals
        if: always()
        run: grep -ho '@@rocq-totals.*' nanofil-glibc.log | awk '!seen[$0]++' | sed 's/^@@rocq-totals /- /' >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-glibc-log
          path: |
            nanofil-glibc.log
            glibc-units.log
          retention-days: 3

  # The push check seals the runtime. This job removes the implementation and audits assumptions for
  # every top-level proof, including Hello's exact fourteen-field list.
  abstract:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: github.ref == 'refs/heads/main'
        with:
          name: filc
          skipPush: true
      - name: Require the cached staging toolchain
        run: python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Add swap for overlapping heavy compiles
        run: |
          sudo fallocate -l 12G /mnt/nanofil.swap && sudo chmod 600 /mnt/nanofil.swap &&
            sudo mkswap /mnt/nanofil.swap >/dev/null && sudo swapon /mnt/nanofil.swap ||
            echo "::warning::could not add swap"
          free -m
      - name: Compile every general file against an abstract runtime
        run: |
          set -o pipefail
          # Two jobs, like the push check, to stay within the runner's memory.
          python3 nanofil/tests/watch.py --label nanofil-glibc-abstract --warn-after 300 --timeout 6000 -- \
            nix build -L --no-link --keep-going --max-jobs 2 --cores 0 \
            .#checks.x86_64-linux.nanofil-glibc-abstract 2>&1 | tee nanofil-glibc-abstract.log
      - name: Cache completed abstract objects
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          { nix eval --raw .#checks.x86_64-linux.nanofil-glibc-abstract --apply 'g: builtins.concatStringsSep "\n"
              (map (d: d.outPath) (builtins.attrValues g.vo ++ [ g.rejectTests g.abstractHello ] ++ builtins.attrValues g.abstractAudit))'; echo; } |
            while read -r p; do if [ -e "$p" ]; then echo "$p"; fi; done | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-glibc-abstract-log
          path: nanofil-glibc-abstract.log
          retention-days: 3
