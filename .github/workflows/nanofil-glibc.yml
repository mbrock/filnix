# Each glibc check builds a complete tree against the compiled Nanofil model.
name: Nanofil glibc

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - "nanofil/rocq/glibc/**"
      - "nanofil/rocq/theories/**"
      - nanofil/nix/glibc.nix
      - "nanofil/nix/glibc/**"
      - nanofil/nix/hello-glibc.nix
      - nanofil/nix/rocq.nix
      - nanofil/nix/rocq-packages.nix
      - nanofil/rocq/scripts/kernel-flags.py
      - nanofil/tests/kernel_flags_test.py
      - "nanofil/survey/glibc/capture.nix"
      - "nanofil/survey/glibc/mixed.nix"
      - "nanofil/survey/glibc/regress.nix"
      - "nanofil/survey/glibc/patches/**"
      - "nanofil/survey/glibc/regress/**"
      - "nanofil/survey/glibc/run/mem16.c"
      - nanofil/tests/watch.py
      - nanofil/tests/rocq_time.py
      - nanofil/tests/rocq_time_test.py
      - nanofil/tests/assumption_scan.py
      - nanofil/tests/test_scan.py
      - nanofil/tests/rocq_totals.py
      - nanofil/tests/rocq_totals_test.py
      - nanofil/tests/rocq_interface_test.py
      - nanofil/tests/rocq_interface.py
      - nanofil/tests/proof_arch_check.py
      - nanofil/tests/proof_arch_check_test.py
      - nanofil/tests/hello_premises.py
      - nanofil/web/rocq/rocq_syntax.pl
      - nanofil/web/rocq/tests/parse.sh
      - nanofil/web/rocq/tests/reprint.pl
      - toolchain.nix
      - "toolchain/**"
      - "compiler/**"
      - "runtime/**"
      - .github/workflows/nanofil-glibc.yml
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

# The push check and the scheduled or manual abstract check run independently.
# Give each push its own group so a busy main checks every revision.
concurrency:
  group: nanofil-glibc-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'full' }}
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
    builders =

jobs:
  glibc:
    if: github.event_name != 'schedule'
    runs-on: nscloud-ubuntu-22.04-amd64-16x32
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: github.ref == 'refs/heads/main'
        with:
          name: filc
          skipPush: true
      - name: Require the cached staging toolchain
        run: python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      # hello_premises.py parses hello_never_panics's statement; the number
      # it prints is the Hello proof's progress measure.
      - name: Count the open premises of hello_never_panics
        run: python3 nanofil/tests/hello_premises.py
      - name: Check proof tree architecture
        run: |
          python3 nanofil/tests/proof_arch_check_test.py
          python3 nanofil/tests/proof_arch_check.py
      # Eight proof compilers leave room for the heavy modules on the 32 GB runner.
      - name: Compile glibc contracts
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label nanofil-glibc --warn-after 300 --timeout 9600 -- \
            nix build -L --no-link --keep-going --max-jobs 2 --cores 8 \
            .#checks.x86_64-linux.nanofil-glibc \
            .#checks.x86_64-linux.nanofil-rocq.kernelFlags 2>&1 | tee nanofil-glibc.log
      # The Fil-C glibc source fixes (survey/glibc/patches): the stock
      # units must fail filcc's checks at -O0 and the patched ones pass.
      # locarch-stock and locarch (the locale loader harness) stay by
      # hand, like mixed.nix's own builds.
      - name: Patched glibc units regression
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label glibc-units --warn-after 300 --timeout 1200 -- \
            nix build -L --no-link -f nanofil/survey/glibc/regress.nix units 2>&1 | tee glibc-units.log
      - name: Cache the sealed tree and the compiled model
        if: success() && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          nix path-info .#checks.x86_64-linux.nanofil-glibc \
            .#checks.x86_64-linux.nanofil-glibc.model.objects | cachix push filc
      # nanofil/AGENTS.md, Rocq proof speed: serial time, critical path,
      # edit-to-result time and the slowest files, printed by the
      # aggregate check whenever it rebuilds. A readout, not a gate.
      - name: Summarize Rocq build-time totals
        if: always()
        run: grep -ho '@@rocq-totals.*' nanofil-glibc.log | awk '!seen[$0]++' | sed 's/^@@rocq-totals /- /' >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-glibc-log
          path: |
            nanofil-glibc.log
            glibc-units.log
          retention-days: 3

  # Compile the runtime-general proofs with only the runtime signature available.
  abstract:
    if: github.event_name != 'push'
    runs-on: nscloud-ubuntu-22.04-amd64-16x32
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: github.ref == 'refs/heads/main'
        with:
          name: filc
          skipPush: true
      - name: Require the cached staging toolchain
        run: python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Compile every general file against an abstract runtime
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label nanofil-glibc-abstract --warn-after 300 --timeout 9600 -- \
            nix build -L --no-link --keep-going --max-jobs 2 --cores 8 \
            .#checks.x86_64-linux.nanofil-glibc-abstract 2>&1 | tee nanofil-glibc-abstract.log
      - name: Cache the abstract tree
        if: success() && github.ref == 'refs/heads/main'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: nix path-info .#checks.x86_64-linux.nanofil-glibc-abstract | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-glibc-abstract-log
          path: nanofil-glibc-abstract.log
          retention-days: 3
