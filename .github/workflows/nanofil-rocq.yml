name: Nanofil Rocq

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the deliberate full mutation campaign instead of the quick gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nanofil-rocq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocq:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select relevant quick gate or explicit campaign
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = true ]; then
            root=nanofil-rocq-full
          else
            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then BASE=HEAD^; fi
            root=$(python3 scripts/nanofil-fleet required-roots --base "$BASE" --rev HEAD)
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          if [ -z "$root" ]; then echo 'No model/compiler inputs changed; skipping Rocq.'; fi
      - uses: cachix/install-nix-action@v31
        if: steps.select.outputs.root != ''
      - name: Require cached staging toolchain, never rebuild LLVM here
        if: steps.select.outputs.root != ''
        run: |
          python3 nanofil/tests/watch.py --label 'Staging cache preflight' -- \
            python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Build and compare
        if: steps.select.outputs.root != ''
        env:
          ROOT: ${{ steps.select.outputs.root }}
        run: |
          warn=120; limit=300
          if [ "$ROOT" = nanofil-rocq-full ]; then warn=600; limit=1800; fi
          python3 nanofil/tests/watch.py --label "$ROOT" --warn-after "$warn" --timeout "$limit" -- \
            nix build -L --no-link --cores 2 ".#checks.x86_64-linux.$ROOT" 2>&1 | tee nanofil-rocq.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.select.outputs.root != ''
        with:
          name: nanofil-rocq-log
          path: nanofil-rocq.log
