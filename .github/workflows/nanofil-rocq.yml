# The quick Rocq gate (model, small corpus) and the grammar round trip
# (parse.sh) after each push that changes their inputs; workflow_dispatch
# with full runs the mutation campaign. It never blocks a push: a red run
# is fixed forward on main.
name: Nanofil Rocq

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - "nanofil/rocq/**"
      # The Gallina backend has its own check (nanofil-backend.yml);
      # nothing in the quick gate reads it.
      - "!nanofil/rocq/backend/**"
      # The glibc campaign has its own incremental compile/probe check.
      - "!nanofil/rocq/glibc/**"
      - "nanofil/src/**"
      - "nanofil/bin/**"
      - nanofil/nix/rocq.nix
      - nanofil/tests/par.sh
      - nanofil/tests/watch.py
      - "nanofil/tests/filc/**"
      - "nanofil/tests/c/**"
      - nanofil/web/rocq/rocq_syntax.pl
      - nanofil/web/rocq/tests/parse.sh
      - nanofil/web/rocq/tests/reprint.pl
      - .github/workflows/nanofil-rocq.yml
  workflow_dispatch:
    inputs:
      full:
        description: Run the deliberate full mutation campaign instead of the quick gate
        type: boolean
        default: false

permissions:
  contents: read

# A started run finishes and publishes its objects; newer pushes coalesce
# into the newest pending run instead of cancelling the only run that can
# seed the cache. The full campaign queues apart.
concurrency:
  group: nanofil-rocq-${{ github.ref }}-${{ inputs.full && 'full' || 'quick' }}
  cancel-in-progress: false

jobs:
  rocq:
    # Each theory and each reprint is its own derivation (nix/rocq.nix):
    # 16 cores compile independent files at once, and main publishes every
    # object and verdict to filc.cachix.org, so a push recompiles only the
    # theories it changed and their importers, here and in every orb.
    runs-on: nscloud-ubuntu-22.04-amd64-16x32
    timeout-minutes: 35
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - name: Select the quick gate or the explicit campaign
        id: select
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = true ]; then root=nanofil-rocq-full; else root=nanofil-rocq; fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
      # Only trusted main publishes, and only these checks' own outputs:
      # each theory's object, each reprint's verdict, the model and the
      # check, never the toolchain or anything else the runner built.
      - name: Install the model cache publisher
        if: github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@v16
        with:
          name: filc
          skipPush: true
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          python3 nanofil/tests/watch.py --label 'Staging cache preflight' -- \
            python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      # One build, so independent work overlaps: a theory's reprint needs
      # only its imports' objects and runs beside its own compile. The
      # grammar round trip (nanofil-rocq-parse) goes with the quick gate;
      # --keep-going finishes every other check when one fails.
      - name: Build and compare
        env:
          ROOT: ${{ steps.select.outputs.root }}
        run: |
          set -o pipefail
          warn=300; limit=1200
          if [ "$ROOT" = nanofil-rocq-full ]; then warn=600; limit=1800; fi
          roots=(".#checks.x86_64-linux.nanofil-rocq.model" ".#checks.x86_64-linux.$ROOT")
          if [ "$ROOT" = nanofil-rocq ]; then roots+=(.#checks.x86_64-linux.nanofil-rocq-parse); fi
          python3 nanofil/tests/watch.py --label "$ROOT" --warn-after "$warn" --timeout "$limit" -- \
            nix build -L --no-link --keep-going --max-jobs auto --cores 0 "${roots[@]}" 2>&1 | tee nanofil-rocq.log
      # Whatever built, even when a corpus or grammar check failed.
      - name: Publish the objects, verdicts and model
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
          ROOT: ${{ steps.select.outputs.root }}
        run: |
          c=.#checks.x86_64-linux
          { nix eval --raw "$c.nanofil-rocq.model" --apply 'm: builtins.concatStringsSep "\n" (map (d: d.outPath)
              (builtins.attrValues m.vo ++ builtins.attrValues m.reprint ++ [ m m.driver m.parse ]))'
            echo; nix eval --raw "$c.$ROOT.outPath"; echo
            nix eval --raw "$c.$ROOT.corpus.outPath"; echo
          } | while read -r p; do [ -e "$p" ] && echo "$p"; done | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-rocq-log
          path: nanofil-rocq.log
