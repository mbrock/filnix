# The quick Rocq gate (model, parse.sh, small corpus) after each push that
# changes its inputs; workflow_dispatch with full runs the mutation campaign.
# It never blocks a push: a red run is fixed forward on main.
name: Nanofil Rocq

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - "nanofil/rocq/**"
      # The Gallina backend has its own check (nanofil-backend.yml);
      # nothing in the quick gate reads it.
      - "!nanofil/rocq/backend/**"
      - "nanofil/src/**"
      - "nanofil/bin/**"
      - nanofil/nix/rocq.nix
      - nanofil/tests/par.sh
      - nanofil/tests/watch.py
      - "nanofil/tests/filc/**"
      - "nanofil/tests/c/**"
      - nanofil/web/rocq/rocq_syntax.pl
      - nanofil/web/rocq/tests/parse.sh
      - nanofil/web/rocq/tests/reprint.pl
      - .github/workflows/nanofil-rocq.yml
  workflow_dispatch:
    inputs:
      full:
        description: Run the deliberate full mutation campaign instead of the quick gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nanofil-rocq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocq:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - name: Select the quick gate or the explicit campaign
        id: select
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = true ]; then root=nanofil-rocq-full; else root=nanofil-rocq; fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          python3 nanofil/tests/watch.py --label 'Staging cache preflight' -- \
            python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Build and compare
        env:
          ROOT: ${{ steps.select.outputs.root }}
        run: |
          warn=300; limit=1200
          if [ "$ROOT" = nanofil-rocq-full ]; then warn=600; limit=1800; fi
          python3 nanofil/tests/watch.py --label "$ROOT" --warn-after "$warn" --timeout "$limit" -- \
            nix build -L --no-link --cores 2 ".#checks.x86_64-linux.$ROOT" 2>&1 | tee nanofil-rocq.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-rocq-log
          path: nanofil-rocq.log
