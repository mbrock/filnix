# Publishes pages/ (static explainers, no build step) to GitHub Pages.
# Pages must be enabled in the repository settings with "GitHub Actions" as
# the source.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4
