# Publishes the site built by .#site (packages/site): pages/ as is and docs/
# rendered with pandoc, which substitutes from cache.nixos.org.
# Pages must be enabled in the repository settings with "GitHub Actions" as
# the source.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/**"
      - "packages/site/**"
      - "nanofil/src/**"
      - "nanofil/docs/**"
      - "nanofil/web/**"
      - "nanofil/rocq/**"
      - "dterm-nix/**"
      # Every Nix file is a page (dterm-nix), and the option index
      # evaluates the modules.
      - "**.nix"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# The playground's build needs filcc-staging, which campaigns publish to
# filc.cachix.org.
env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Every push builds at once; only publishing waits its turn.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the site
        run: |
          nix build -L .#site
          cp -rL result _site
          # The commit it was built from, for the publish job to compare
          # with what is live.
          chmod u+w _site
          echo "$GITHUB_SHA" > _site/commit.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # A publish in progress finishes; a newer one waits and replaces any other
  # waiting one, so the site follows main even when pushes come every
  # minute. A build that finishes after a newer one has gone live is not
  # published: its commit is already part of the live site's.
  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is this newer than the live site?
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          # A fresh query string, so the CDN's ten-minute cache is not asked.
          live=$(curl -fsS "${site%/}/commit.txt?$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true)
          status=unknown
          if [[ $live =~ ^[0-9a-f]{40}$ ]]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$live...$GITHUB_SHA" --jq .status || echo unknown)
          fi
          echo "live: ${live:-none}; this: $GITHUB_SHA; this is $status"
          # behind or identical: the live commit already contains this one.
          # Anything else, including an unknown live commit, publishes.
          case $status in
            behind|identical)
              echo "::notice::Not publishing $GITHUB_SHA: the live site's $live already contains it."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - id: deploy
        if: steps.live.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

  # The built site at phone widths. It reports and never holds back the
  # publish above: a red run is fixed forward.
  phone:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
      - name: Unpack the deployed site
        run: mkdir _site && tar -xf artifact.tar -C _site
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the browser
        run: |
          python3 nanofil/tests/watch.py --label 'Browser install' -- \
            npm install --global agent-browser@0.38.1
          python3 nanofil/tests/watch.py --label 'Chromium install' -- \
            agent-browser install --with-deps
      - name: Check the widest pages at phone width
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label 'Pages at 320px' -- \
            node packages/site/phone.mjs _site 320 2>&1 | tee site-phone.log
      - name: Check delayed browser navigation
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label 'Rocq delayed navigation' -- \
            node nanofil/web/rocq/tests/navigation.mjs 2>&1 | tee rocq-phone-navigation.log
      - name: Check every Rocq page at phone widths
        run: |
          set -o pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/rocq-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent --fail \
            http://127.0.0.1:8765/nanofil/rocq/index.html -o /dev/null
          pids=()
          for width in 320 390; do
            (
              python3 nanofil/tests/watch.py --label "Rocq phone pages ${width}px" \
                --warn-after 300 --timeout 1200 -- \
                node nanofil/web/rocq/tests/layout.mjs http://127.0.0.1:8765 --pages-only "$width" \
                2>&1 | tee "rocq-phone-${width}.log"
            ) &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocq-phone-layout
          path: |
            rocq-phone-*.log
            site-phone.log
          if-no-files-found: ignore
