# Publishes the site built by .#site (packages/site): pages/ as is and docs/
# rendered with pandoc, which substitutes from cache.nixos.org.
# Pages must be enabled in the repository settings with "GitHub Actions" as
# the source.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/**"
      - "packages/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the site
        run: |
          nix build -L .#site
          cp -rL result _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
