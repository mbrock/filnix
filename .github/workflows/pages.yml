# One runner builds and publishes; no artifact handoff or browser gate.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/**"
      - "packages/site/**"
      - "nanofil/src/**"
      - "nanofil/docs/**"
      - "nanofil/web/**"
      - "nanofil/rocq/**"
      - "dterm-nix/**"
      - "deploy/site/**"
      - "blocks/**"
      # Every Nix file is a page (dterm-nix), and the option index
      # evaluates the modules.
      - "**.nix"
      - flake.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

# A cold build finishes and seeds the shared cache. Keep only the latest
# pending push. Share the lock with recovery and scheduled retention.
concurrency:
  group: filnix-org
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
    builders =

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: filnix-org
      url: https://filnix.org
    steps:
      - uses: actions/checkout@v4
        with:
          # history.py dates every document from the whole history.
          fetch-depth: 0
      - name: Check serving and publication contracts
        run: |
          node --test deploy/site/worker.test.mjs
          python3 -m unittest discover -s tests -p 'test_site_*.py'
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: filc
          skipPush: true
      - name: Require cached toolchain foundations
        run: |
          python3 scripts/ci-cache-check.py \
            packages.x86_64-linux.filcc-staging packages.x86_64-linux.site-swipl
      - name: Build the complete site
        run: nix build -L --max-jobs auto --cores 0 .#site
      - name: Prepare the release
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILNIX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILNIX_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          cp -rL result _site
          chmod u+w _site
          echo "$GITHUB_SHA" > _site/commit.txt
          # Dates and activity under each document's title, the home
          # page's recent documents, and history.json, from git.
          python3 packages/site/history.py _site .
          bash deploy/site/equity.sh _site
          python3 deploy/site/prepare.py _site "$GITHUB_SHA"
      - name: Publish the release
        id: publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILNIX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILNIX_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          GH_TOKEN: ${{ github.token }}
        run: |
          aws configure set default.s3.max_concurrent_requests 32
          bash deploy/site/publish.sh
      - name: Check the live release
        if: steps.publish.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(curl --retry 5 --retry-all-errors --retry-delay 2 -fsS \
            "https://filnix.org/__releases/$GITHUB_SHA/commit.txt")" = "$GITHUB_SHA"
          live=$(curl -fsS https://filnix.org/commit.txt)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$live" --jq .status)
          case $status in ahead|identical) ;; *) echo "Unexpected live SHA: $live"; exit 1 ;; esac
      # Publication is already live. Cache only exact generated outputs,
      # not the toolchain or a mutable latest bundle, for subsequent pushes.
      - name: Cache generated pages
        if: ${{ !cancelled() }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          set -o pipefail
          nix build --no-link --print-out-paths --max-jobs 0 \
            .#site.rocqPages .#site.prologPages | cachix push filc
      # Retain the recovery format, but upload it after publication.
      - name: Package the published site
        run: tar -C _site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 3
