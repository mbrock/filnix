# The glibc proofs that need the interpreter's runtime
# (nanofil/rocq/glibc/runtime-concrete.txt). Each listed file compiles with
# its whole import closure at that runtime, about 270 files for one theorem,
# so this runs twice daily and on pushes that touch a listed file, Fix.v or
# the runtime, rather than in the glibc push check.
name: Nanofil glibc concrete

on:
  push:
    branches: [main]
    paths:
      - nanofil/rocq/glibc/runtime-concrete.txt
      - nanofil/rocq/glibc/Fix.v
      - "nanofil/rocq/glibc/hi_atexit/**"
      - nanofil/rocq/theories/core/Runtime.v
      - nanofil/nix/glibc.nix
      - nanofil/tests/rocq_reject.py
      - nanofil/tests/rocq_interface.py
      - .github/workflows/nanofil-glibc-concrete.yml
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: nanofil-glibc-concrete-${{ github.ref }}
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
    builders =

jobs:
  concrete:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        if: github.ref == 'refs/heads/main'
        with:
          name: filc
          skipPush: true
      - name: Require the cached staging toolchain
        run: python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Compile the concrete closures and reject them at the sealed runtime
        run: |
          set -o pipefail
          python3 nanofil/tests/watch.py --label nanofil-glibc-concrete --warn-after 300 --timeout 3600 -- \
            nix build -L --no-link --keep-going --max-jobs auto --cores 0 \
            .#checks.x86_64-linux.nanofil-glibc-concrete 2>&1 | tee nanofil-glibc-concrete.log
      - name: Cache completed concrete objects
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          { nix eval --raw .#checks.x86_64-linux.nanofil-glibc-concrete --apply 'g: builtins.concatStringsSep "\n"
              (map (d: d.outPath) (builtins.attrValues g.vo ++ builtins.attrValues g.rejected ++ [ g ]))'; echo; } |
            while read -r p; do if [ -e "$p" ]; then echo "$p"; fi; done | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-glibc-concrete-log
          path: nanofil-glibc-concrete.log
          retention-days: 3
