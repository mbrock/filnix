# The extracted Rocq validator on every module nanofil -O emits for the
# corpus, GNU hello, zlib, Lua and SQLite (nanofil/nix/rocq-gate.nix,
# nanofil/rocq/gate.sh), after each push that changes the compiler, the
# 14 theories the driver is extracted from, or the gate. It never blocks
# a push: a red run is a module the proved validator rejects, fixed
# forward on main.
name: Nanofil Gate

on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - "nanofil/src/**"
      - "nanofil/bin/**"
      - "nanofil/tests/filc/**"
      - "nanofil/tests/c/**"
      - "nanofil/tests/fixtures/**"
      - "nanofil/tests/backend/**"
      - "nanofil/tests/float/**"
      - nanofil/tests/par.sh
      - nanofil/tests/watch.py
      - nanofil/rocq/gate.sh
      - nanofil/rocq/extraction/main.ml
      - nanofil/rocq/theories/Term.v
      - nanofil/rocq/theories/Maps.v
      - nanofil/rocq/theories/Ieee.v
      - nanofil/rocq/theories/Syntax.v
      - nanofil/rocq/theories/Cfg.v
      - nanofil/rocq/theories/Values.v
      - nanofil/rocq/theories/Memory.v
      - nanofil/rocq/theories/Runtime.v
      - nanofil/rocq/theories/Ops.v
      - nanofil/rocq/theories/Semantics.v
      - nanofil/rocq/theories/Run.v
      - nanofil/rocq/theories/Validate.v
      - nanofil/rocq/theories/Transport.v
      - nanofil/rocq/theories/Extract.v
      - nanofil/nix/rocq-gate.nix
      - nanofil/nix/rocq.nix
      - nanofil/nix/nanofil-cc.nix
      - nanofil/nix/sqlite.nix
      - nanofil/nix/corpus.nix
      - .github/workflows/nanofil-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanofil-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          python3 nanofil/tests/watch.py --label 'Staging cache preflight' -- \
            python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Judge every -O module with the extracted validator
        run: |
          python3 nanofil/tests/watch.py --label nanofil-rocq-gate --warn-after 900 --timeout 2400 -- \
            nix build -L --max-jobs auto --cores 0 -o gate .#checks.x86_64-linux.nanofil-rocq-gate 2>&1 | tee nanofil-gate.log
          cat gate/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-gate-log
          path: nanofil-gate.log
