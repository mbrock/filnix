# The extracted Rocq validator on every module nanofil -O emits for the
# corpus, GNU hello, zlib, Lua and SQLite (nanofil/nix/rocq-gate.nix,
# nanofil/rocq/scripts/gate.sh), after each push that changes the compiler, the
# 15 theories the driver is extracted from, or the gate. It never blocks
# a push: a red run is a module the proved validator rejects, fixed
# forward on main.
name: Nanofil Gate

on:
  push:
    branches: [main]
    paths:
      - flake.lock
      - "nanofil/src/**"
      - "nanofil/bin/**"
      - "nanofil/tests/filc/**"
      - "nanofil/tests/c/**"
      - "nanofil/tests/fixtures/**"
      - "nanofil/tests/backend/**"
      - "nanofil/tests/float/**"
      - nanofil/tests/par.sh
      - nanofil/tests/watch.py
      - nanofil/rocq/scripts/gate.sh
      - nanofil/rocq/extraction/main.ml
      - "nanofil/rocq/theories/core/**"
      - nanofil/nix/rocq-gate.nix
      - nanofil/nix/rocq.nix
      - nanofil/nix/nanofil-cc.nix
      - nanofil/nix/sqlite.nix
      - nanofil/nix/corpus.nix
      - .github/workflows/nanofil-gate.yml
  workflow_dispatch:

permissions:
  contents: read

# A started run finishes and publishes what it compiled; newer pushes
# coalesce into the newest pending run instead of cancelling it.
concurrency:
  group: nanofil-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # The corpus judging uses every core, beside sqlite3.c's one-core -O
    # compile; main publishes each package's checked modules and each
    # part's verdicts to filc.cachix.org, so a push that leaves src/ and
    # bin/ alone (the validator's theories, tests, the flake) fetches the
    # packages instead of compiling them again.
    runs-on: nscloud-ubuntu-22.04-amd64-16x32
    timeout-minutes: 45
    env:
      NIX_CONFIG: |
        extra-substituters = https://filc.cachix.org
        extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
        builders =
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Only trusted main publishes, and only the gate's own outputs.
      - name: Install the gate cache publisher
        if: github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@v16
        with:
          name: filc
          skipPush: true
      - name: Require cached staging toolchain, never rebuild LLVM here
        run: |
          python3 nanofil/tests/watch.py --label 'Staging cache preflight' -- \
            python3 scripts/ci-cache-check.py packages.x86_64-linux.filcc-staging
      - name: Judge every -O module with the extracted validator
        run: |
          python3 nanofil/tests/watch.py --label nanofil-rocq-gate --warn-after 900 --timeout 2400 -- \
            nix build -L --max-jobs auto --cores 0 -o gate .#checks.x86_64-linux.nanofil-rocq-gate 2>&1 | tee nanofil-gate.log
          cat gate/summary
      # Whatever built, even when the model rejected a module.
      - name: Publish the packages' modules and the verdicts
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.FILC_CACHIX_AUTH_TOKEN }}
        run: |
          nix eval --raw .#checks.x86_64-linux.nanofil-rocq-gate --apply 'g: builtins.concatStringsSep "\n" (map (d: d.outPath)
            (builtins.attrValues g.packages ++ builtins.attrValues g.parts ++ [ g g.driver ]))' |
            while read -r p; do [ -e "$p" ] && echo "$p"; done | cachix push filc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nanofil-gate-log
          path: nanofil-gate.log
