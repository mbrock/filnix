# CI never compiles Fil-C: LLVM and the package set are far too large for a
# hosted runner. Its core job requires scripts/ship-outputs.txt (the compiler
# and curated baseline) in public caches with their whole closures. The
# campaign publishes the wider scripts/ci-outputs.txt distribution set.
# The separate artifact job uses the cached compiler and substitutes
# the PHP and /opt/fil tarballs and the image (max-jobs = 0 forbids local
# builds). From main it publishes the image to ghcr.io and keeps the PHP
# tarball as a workflow artifact; releases are release.yml.
#
# Missing distribution artifacts are pending, not failed: their job skips
# until the campaign publishes them. Cache/evaluation/test errors still fail.
name: Binary cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NIX_CONFIG: |
    extra-substituters = https://filc.cachix.org
    extra-trusted-public-keys = filc.cachix.org-1:8rA7kXyu1HaJuMTsAKfA9fU/+r8YtLv5KiZ5hfDNZMk=
    max-jobs = 0
    builders =

jobs:
  cache:
    name: Toolchain and baseline are cached
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Closures are in the public caches
        run: |
          mapfile -t attrs < <(grep -v -e '^#' -e '^$' scripts/ship-outputs.txt)
          python3 scripts/ci-cache-check.py "${attrs[@]}"
      - name: The cached compiler stops an out-of-bounds write
        run: |
          cc=$(nix build --no-link --print-out-paths .#filcc)/bin/clang
          printf '%s\n' '#include <stdio.h>' \
            'int main(int argc, char **argv) { int a[4]; a[argc + 4] = 1; printf("%d\n", a[argc + 4]); }' > oob.c
          "$cc" -o oob oob.c
          if ./oob 2> panic.txt; then echo "out-of-bounds write was not caught"; exit 1; fi
          grep 'filc panic' panic.txt

  distribution:
    name: Distribution readiness
    needs: cache
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check distribution availability
        id: check
        run: |
          set +e
          python3 scripts/ci-cache-check.py \
            packages.x86_64-linux.php-dist \
            packages.x86_64-linux.php-docker \
            packages.x86_64-linux.php84_25-dist \
            packages.x86_64-linux.php84_25-docker \
            packages.x86_64-linux.optfil
          status=$?
          set -e
          case "$status" in
            0) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Distribution artifacts are not cached yet; waiting for the port campaign."
              echo "### Distribution pending" >> "$GITHUB_STEP_SUMMARY"
              echo "The foundation passed. Distribution tests and publishing are skipped until the campaign caches the artifacts; rerun this workflow afterward." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac

  php:
    name: Tarballs and image
    needs: distribution
    if: needs.distribution.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Substitute
        run: |
          nix build .#php-dist --out-link php-dist
          nix build .#php-docker --out-link php-docker
          nix build .#php84_25-dist --out-link php84_25-dist
          nix build .#php84_25-docker --out-link php84_25-docker
          nix build .#optfil --out-link optfil
          {
            echo "TARBALL=$(basename "$(readlink php-dist)" | cut -d- -f2-)"
            echo "TAG=$(nix eval --raw .#php-docker.imageTag)"
            echo "TARBALL_84_25=$(basename "$(readlink php84_25-dist)" | cut -d- -f2-)"
            echo "TAG_84_25=$(nix eval --raw .#php84_25-docker.imageTag)"
          } >> "$GITHUB_ENV"
      - name: The tarball runs without Nix
        run: |
          packages/php-dist/test/run.sh php-dist debian:13 alpine:3
          packages/php-dist/test/run.sh php84_25-dist debian:13 alpine:3
          packages/optfil/test/run.sh optfil debian:13 alpine:3
      - name: The image serves PHP
        run: |
          for image in php-docker:$TAG php84_25-docker:$TAG_84_25; do
            podman load < "${image%%:*}"
            podman run --rm "filnix-php:${image#*:}" php -r 'echo PHP_VERSION, "\n"; exit(PHP_VERSION === $argv[1] && extension_loaded("Zend OPcache") ? 0 : 1);' "${image#*:}"
          done
      - run: cp -L php-dist "$TARBALL"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARBALL }}
          path: ${{ env.TARBALL }}
          compression-level: 0
      - run: cp -L php84_25-dist "$TARBALL_84_25"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARBALL_84_25 }}
          path: ${{ env.TARBALL_84_25 }}
          compression-level: 0
      - name: Publish the image to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/filnix-php
          for tag in "$TAG" latest; do
            skopeo copy --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
              docker-archive:php-docker "docker://$image:$tag"
          done
          # The vulnerable reproduction build must never become :latest.
          skopeo copy --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:php84_25-docker "docker://$image:$TAG_84_25"
